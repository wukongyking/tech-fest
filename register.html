<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Event Registration</title>
</head>
<body>

  <h1>Tech Event Registration</h1>
  <p>Fill in the details below to register for the event.</p>

  <form action="#" method="post">

    <p>
      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone">
    </p>

    <p>
      <label for="organization">College / Company:</label><br>
      <input type="text" id="organization" name="organization">
    </p>

    <p>
      <label for="role">I am a:</label><br>
      <select id="role" name="role">
        <option value="student">Student</option>
        <option value="professional">Professional</option>
        <option value="other">Other</option>
      </select>
    </p>

    <p>
      Interested Tracks:<br>
      <input type="checkbox" id="ai" name="tracks" value="ai">
      <label for="ai">AI / Machine Learning</label><br>
      <input type="checkbox" id="web" name="tracks" value="web">
      <label for="web">Web Development</label><br>
      <input type="checkbox" id="cyber" name="tracks" value="cybersecurity">
      <label for="cyber">Cybersecurity</label><br>
      <input type="checkbox" id="cloud" name="tracks" value="cloud">
      <label for="cloud">Cloud Computing</label>
    </p>

    <p>
      T-shirt Size:<br>
      <input type="radio" id="s" name="size" value="S">
      <label for="s">S</label>
      <input type="radio" id="m" name="size" value="M">
      <label for="m">M</label>
      <input type="radio" id="l" name="size" value="L">
      <label for="l">L</label>
      <input type="radio" id="xl" name="size" value="XL">
      <label for="xl">XL</label>
    </p>

    <p>
      <label for="comments">Any questions or comments?</label><br>
      <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
    </p>

    <p>
      <input type="submit" value="Register">
      <input type="reset" value="Clear">
    </p>

  </form>

</body>
</html>
